plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.btb.standalone'
    compileSdk 34

    defaultConfig {
        applicationId "com.btb.standalone"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "0.1"
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

chaquopy {
    defaultConfig {
        pip {
            install "requests==2.32.3"
            install "httpx==0.28.1"
            install "loguru"
            install "tinydb"
            install "qrcode"
            install "h2"
            install "ntplib"
            install "certifi"
        }
    }
}