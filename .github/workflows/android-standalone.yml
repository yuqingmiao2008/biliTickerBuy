name: Build BTB Standalone Probe

on:
  workflow_dispatch:
  push:
    branches:
      - feat/mobile-interval-multiaccount
    paths:
      - 'android-standalone/**'
      - '.github/workflows/android-standalone.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          TOOLS="$(ls -d "$SDK"/cmdline-tools/*/bin | tail -1)"
          echo "$TOOLS" >> "$GITHUB_PATH"
          yes | "$TOOLS/sdkmanager" --licenses >/dev/null || true
          "$TOOLS/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0" >/dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build standalone probe APK
        working-directory: android-standalone
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Sign APK
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p dist
          APK_IN="android-standalone/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK_IN"
          if [ -n "${KEYSTORE_B64:-}" ]; then
            echo "$KEYSTORE_B64" | base64 -d > /tmp/keystore.p12
            BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
            "$BT/zipalign" -f -p 4 "$APK_IN" /tmp/aligned.apk
            "$BT/apksigner" sign --ks /tmp/keystore.p12 \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass "pass:$KEYSTORE_PASSWORD" \
              --key-pass "pass:$KEY_PASSWORD" \
              --out dist/btb-standalone.apk /tmp/aligned.apk
            rm -f /tmp/keystore.p12
          else
            cp "$APK_IN" dist/btb-standalone.apk
          fi
          sha256sum dist/btb-standalone.apk > dist/btb-standalone.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: btb-standalone-apk
          path: |
            dist/btb-standalone.apk
            dist/btb-standalone.apk.sha256