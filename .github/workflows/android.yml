name: Build BTB Mobile APK

on:
  workflow_dispatch:
  push:
    branches:
      - feat/mobile-interval-multiaccount

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" >/dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: android-app
        run: gradle assembleDebug --no-daemon

      - name: Sign APK
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p dist
          APK_IN="android-app/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK_IN"
          if [ -n "${KEYSTORE_B64:-}" ]; then
            echo "$KEYSTORE_B64" | base64 -d > /tmp/keystore.p12
            BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
            "$BT/zipalign" -f -p 4 "$APK_IN" /tmp/aligned.apk
            "$BT/apksigner" sign --ks /tmp/keystore.p12 \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass "pass:$KEYSTORE_PASSWORD" \
              --key-pass "pass:$KEY_PASSWORD" \
              --out dist/btb-mobile.apk /tmp/aligned.apk
            rm -f /tmp/keystore.p12
          else
            cp "$APK_IN" dist/btb-mobile.apk
          fi
          sha256sum dist/btb-mobile.apk > dist/btb-mobile.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: btb-mobile-apk
          path: |
            dist/btb-mobile.apk
            dist/btb-mobile.apk.sha256